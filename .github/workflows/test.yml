name: Run Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pytest
        run: pip install pytest
      - name: run test
        run: python test_calc.py
